# Blueprint do Render para a API.
# O PostgreSQL fica no Neon, então este arquivo não cria banco de dados.
# Não coloque senhas aqui. DATABASE_URL e FRONTEND_URL são preenchidas no painel.

services:
  - type: web
    name: meu-plano-de-estudos-api
    runtime: node
    plan: free
    rootDir: backend
    buildCommand: npm install
    startCommand: npm start
    healthCheckPath: /api/health
    envVars:
      - key: NODE_VERSION
        value: "22"
      - key: DATABASE_URL
        sync: false
      - key: FRONTEND_URL
        sync: false
